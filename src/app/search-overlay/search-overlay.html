<div id="searchOv" [class.open]="ui.searchOpen()">
   <button class="sovclose" id="searchClose" (click)="close()"><i class="fas fa-times"></i></button>
   <div class="sovbox">
      <h4>What are you craving today?</h4>
      <div class="sovinput">
         <input type="text" id="searchInput" placeholder="Search burgers, pizza, chicken..." autocomplete="off" [(ngModel)]="query"/>
         <button><i class="fas fa-search"></i></button>
      </div>
      <div class="sovcats">
         <div class="sovcat" [class.active]="ui.activeCategory()==='all'" (click)="select('all')"><img src="img/menu/1.jpg" alt=""/>All Items</div>
         <div class="sovcat" [class.active]="ui.activeCategory()==='burgers'" (click)="select('burgers')"><img src="img/menu/1.jpg" alt=""/>Burgers</div>
         <div class="sovcat" [class.active]="ui.activeCategory()==='pizza'" (click)="select('pizza')"><img src="img/menu/2.jpg" alt=""/>Pizza</div>
         <div class="sovcat" [class.active]="ui.activeCategory()==='chicken'" (click)="select('chicken')"><img src="img/menu/3.jpg" alt=""/>Chicken</div>
         <div class="sovcat" [class.active]="ui.activeCategory()==='wraps'" (click)="select('wraps')"><img src="img/menu/4.jpg" alt=""/>Wraps</div>
         <div class="sovcat" [class.active]="ui.activeCategory()==='pasta'" (click)="select('pasta')"><img src="img/menu/5.jpg" alt=""/>Pasta</div>
         <div class="sovcat" [class.active]="ui.activeCategory()==='desserts'" (click)="select('desserts')"><img src="img/menu/6.jpg" alt=""/>Desserts</div>
      </div>
      <div class="sovtrend">
         <p><i class="fas fa-fire me-1" style="color:var(--secondary);"></i>Trending Searches</p>
         <span class="ttag" (click)="trend('Smash Burger')">Smash Burger</span>
         <span class="ttag" (click)="trend('Nashville Chicken')">Nashville Chicken</span>
         <span class="ttag" (click)="trend('Truffle Pizza')">Truffle Pizza</span>
         <span class="ttag" (click)="trend('Lava Cake')">Lava Cake</span>
         <span class="ttag" (click)="trend('Loaded Fries')">Loaded Fries</span>
         <span class="ttag" (click)="trend('Mango Shake')">Mango Shake</span>
      </div>
   </div>
</div>
